// 全局变量
let currentQ = 0;
let score = 0;
let wrongAnswers = [];
let userAnswers = [];
let selectedOptions = []; // 当前题选中的选项（多选题用）
let answered = false; // 当前题是否已作答

// 渲染题目
function renderQuestion() {
  const q = questions[currentQ];
  const container = document.getElementById('question-container');
  const progress = ((currentQ) / questions.length) * 100;
  document.getElementById('progress-fill').style.width = progress + '%';

  const typeLabel = q.type === 'multi' ? '<span class="question-type">多选题</span>' : '<span class="question-type" style="background:#e3f2fd;color:#1565c0;">单选题</span>';

  let optionsHTML = '';
  q.options.forEach((opt, i) => {
    const letter = String.fromCharCode(65 + i);
    optionsHTML += `
      <div class="option" id="opt-${i}" onclick="toggleOption(${i})">
        <span class="option-letter">${letter}.</span>
        <span>${opt}</span>
      </div>
    `;
  });

  let buttonHTML = '';
  if (q.type === 'multi') {
    buttonHTML = `<button class="btn btn-confirm" id="confirm-btn" onclick="confirmAnswer()" disabled>确认答案</button>`;
  }

  container.innerHTML = `
    <div class="question-number">第 ${currentQ + 1} / ${questions.length} 题 ${typeLabel}</div>
    <div class="question-scene">🎬 场景：${q.scene}</div>
    <div class="question-text">${q.question}</div>
    <div class="options">${optionsHTML}</div>
    <div class="explanation" id="explanation"></div>
    ${buttonHTML}
    <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()" style="display:none;">${currentQ === questions.length - 1 ? '查看结果 🎯' : '下一题 →'}</button>
  `;

  selectedOptions = [];
  answered = false;
}

// 切换选项（多选题和单选题通用）
function toggleOption(index) {
  if (answered) return;
  const q = questions[currentQ];

  if (q.type === 'single') {
    // 单选题：直接选中并显示答案
    selectedOptions = [index];
    document.querySelectorAll('.option').forEach((el, i) => {
      el.classList.remove('selected');
      if (i === index) el.classList.add('selected');
    });
    showAnswer();
  } else {
    // 多选题：切换选中状态
    const idx = selectedOptions.indexOf(index);
    if (idx > -1) {
      selectedOptions.splice(idx, 1);
      document.getElementById('opt-' + index).classList.remove('selected');
    } else {
      selectedOptions.push(index);
      document.getElementById('opt-' + index).classList.add('selected');
    }
    // 更新确认按钮状态
    const confirmBtn = document.getElementById('confirm-btn');
    if (confirmBtn) {
      confirmBtn.disabled = selectedOptions.length === 0;
    }
  }
}

// 确认答案（多选题用）
function confirmAnswer() {
  if (selectedOptions.length === 0) return;
  showAnswer();
}

// 显示答案和解析
function showAnswer() {
  answered = true;
  const q = questions[currentQ];
  const isCorrect = JSON.stringify(selectedOptions.sort()) === JSON.stringify(q.correct.sort());

  // 标记选项
  document.querySelectorAll('.option').forEach((el, i) => {
    el.classList.add('disabled');
    el.classList.remove('selected');
    if (q.correct.includes(i)) {
      el.classList.add('correct');
    } else if (selectedOptions.includes(i)) {
      el.classList.add('wrong');
    }
  });

  // 记录答题结果
  userAnswers.push([...selectedOptions]);
  if (isCorrect) {
    score++;
  } else {
    wrongAnswers.push({
      questionIndex: currentQ,
      userAnswer: [...selectedOptions],
      correctAnswer: [...q.correct]
    });
  }

  // 显示解析
  const explanation = document.getElementById('explanation');
  const correctLetters = q.correct.map(i => String.fromCharCode(65 + i)).join('、');
  const userLetters = selectedOptions.map(i => String.fromCharCode(65 + i)).join('、');

  let wrongReasonsHTML = '';
  if (q.explanation.wrongReasons && q.explanation.wrongReasons.length > 0) {
    wrongReasonsHTML = '<div style="margin-top:10px;"><strong>其他选项为什么错：</strong>';
    q.explanation.wrongReasons.forEach(wr => {
      wrongReasonsHTML += `<div class="wrong-reason"><strong>${wr.letter}.</strong> ${wr.reason}</div>`;
    });
    wrongReasonsHTML += '</div>';
  }

  explanation.className = 'explanation show ' + (isCorrect ? 'correct-exp' : 'wrong-exp');
  explanation.innerHTML = `
    <div class="explanation-title">${isCorrect ? '🎉 回答正确！' : '💡 回答错误，来看解析：'}</div>
    <div class="explanation-content">
      <p><strong>正确答案：${correctLetters}</strong>${!isCorrect ? ` | 你的答案：${userLetters}` : ''}</p>
      <p>${q.explanation.correct}</p>
      ${wrongReasonsHTML}
      <div class="theory">${q.theory}</div>
    </div>
  `;

  // 隐藏确认按钮，显示下一题按钮
  const confirmBtn = document.getElementById('confirm-btn');
  if (confirmBtn) confirmBtn.style.display = 'none';
  document.getElementById('next-btn').style.display = 'block';
}

// 下一题
function nextQuestion() {
  if (currentQ < questions.length - 1) {
    currentQ++;
    renderQuestion();
  } else {
    showResult();
  }
}

// 显示结果
function showResult() {
  document.getElementById('quiz-area').style.display = 'none';
  const resultArea = document.getElementById('result-area');
  resultArea.style.display = 'block';

  const percentage = Math.round((score / questions.length) * 100);
  let level, desc;

  if (score === questions.length) {
    level = '🌟🌟🌟 完美通关！面谈大师';
    desc = '太厉害了！10道题全部答对，你已经是绩效面谈的高手！这些场景你都能从容应对，继续保持，也可以把你的经验分享给团队的其他管理者。下面是文章的完整章节，你可以根据兴趣选读，也可以温故知新。';
  } else if (score >= 8) {
    level = '🌟🌟 优秀！面谈达人';
    desc = '非常不错！你已经掌握了绩效面谈的核心方法，大部分场景都能应对自如。还有少数场景可以再精进一下，下面是针对你的薄弱环节的提升建议和推荐阅读。';
  } else if (score >= 5) {
    level = '🌟 良好！进阶中';
    desc = '还不错！你对绩效面谈有基本的了解，但在一些关键场景上还有提升空间。别担心，绩效面谈是可以练出来的，下面是针对你的提升建议和推荐阅读，认真看完一定会有收获。';
  } else {
    level = '💪 加油！新手起步';
    desc = '没关系，绩效面谈是一门可以学习的技能，大部分管理者刚开始都会踩坑。重要的是意识到问题并开始学习。下面是针对你的提升建议和推荐阅读，建议从头开始认真看，一定会有很大提升。';
  }

  // 个性化提升建议（根据错题）
  let tipsHTML = '';
  if (wrongAnswers.length > 0) {
    const uniqueTips = [...new Set(wrongAnswers.map(wa => questions[wa.questionIndex].tip))];
    tipsHTML = `
      <div class="section-title">💡 针对你的个性化提升建议</div>
      <ul class="tips-list">
        ${uniqueTips.map(tip => `<li>${tip}</li>`).join('')}
      </ul>
    `;
  } else {
    tipsHTML = `
      <div class="section-title">💡 给面谈大师的进阶建议</div>
      <ul class="tips-list">
        <li>把你的面谈经验整理成案例，分享给团队其他管理者，教学相长</li>
        <li>尝试在面谈中使用更多开放式问题，引导员工自己找到答案，而不是你直接给建议</li>
        <li>关注面谈后的跟进执行率，这才是面谈价值的真正体现</li>
        <li>可以尝试做「面谈复盘」，每次面谈后记录哪些做得好、哪些可以改进，持续迭代</li>
      </ul>
    `;
  }

  // 个性化阅读清单（根据错题推荐；全对时显示全部）
  let readingHTML = '';
  let recommendedSections;
  if (wrongAnswers.length > 0) {
    // 根据错题推荐对应章节
    const sectionKeys = [...new Set(wrongAnswers.map(wa => questions[wa.questionIndex].section))];
    recommendedSections = sectionKeys;
  } else {
    // 全对时显示全部章节
    recommendedSections = Object.keys(articleSections);
  }

  readingHTML = `
    <div class="section-title">📚 ${wrongAnswers.length > 0 ? '你的个性化阅读清单（共 ' + recommendedSections.length + ' 个章节）' : '完整阅读清单（共 ' + recommendedSections.length + ' 个章节，按兴趣选读）'}</div>
    <div style="font-size:13px;color:#888;margin-bottom:12px;text-align:left;">${wrongAnswers.length > 0 ? '根据你的错题，为你精选了以下章节，点击卡片即可跳转至文章对应部分深入阅读：' : '你已经全部答对，可以根据兴趣选读，也可以温故知新。点击卡片即可跳转至文章对应部分：'}</div>
    <div class="reading-list">
      ${recommendedSections.map((key, idx) => {
        const sec = articleSections[key];
        return `
          <a class="reading-card" href="${sec.url}" target="_blank">
            <div class="reading-card-title">${idx + 1}. ${sec.name}</div>
            <div class="reading-card-path">📍 ${sec.path}</div>
            <div class="reading-card-desc">${sec.desc}</div>
            <div class="reading-card-kp">🔗 对应知识点：${sec.kp}</div>
          </a>
        `;
      }).join('')}
    </div>
  `;

  resultArea.innerHTML = `
    <div class="result-card">
      <div class="score-circle">
        <div class="score-num">${score}</div>
        <div class="score-total">/ ${questions.length} 题</div>
      </div>
      <div class="result-level">${level}</div>
      <div class="result-desc">${desc}</div>
      ${tipsHTML}
      ${readingHTML}
      <button class="btn restart-btn" onclick="restart()">🔄 再测一次</button>
    </div>
  `;

  // 滚动到顶部
  window.scrollTo(0, 0);
}

// 重新开始
function restart() {
  currentQ = 0;
  score = 0;
  wrongAnswers = [];
  userAnswers = [];
  selectedOptions = [];
  answered = false;
  document.getElementById('result-area').style.display = 'none';
  document.getElementById('quiz-area').style.display = 'block';
  renderQuestion();
}

// 初始化
renderQuestion();
</script>
</body>
</html>
