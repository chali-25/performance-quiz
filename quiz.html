let currentQ = 0;
let score = 0;
let answered = false;
let wrongAnswers = [];

function renderQuestion() {
  const q = questions[currentQ];
  const area = document.getElementById('quizArea');
  const progress = ((currentQ) / questions.length) * 100;
  document.getElementById('progressFill').style.width = progress + '%';
  
  let optionsHTML = q.options.map((opt, i) => 
    `<button class="option-btn" onclick="selectOption(${i})">
      <span class="option-label">${String.fromCharCode(65+i)}</span>
      <span>${opt}</span>
    </button>`
  ).join('');
  
  area.innerHTML = `
    <div class="question-card">
      <span class="question-num">第 ${currentQ + 1} / ${questions.length} 题</span>
      <div class="question-scene">🎬 <b>场景：</b>${q.scene}</div>
      <div class="question-text">${q.question}</div>
      <div class="options" id="optionsArea">${optionsHTML}</div>
      <div id="explanationArea"></div>
    </div>
  `;
  answered = false;
}

function selectOption(index) {
  if (answered) return;
  answered = true;
  
  const q = questions[currentQ];
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach((btn, i) => {
    btn.classList.add('disabled');
    if (i === q.correct) btn.classList.add('correct');
    if (i === index && index !== q.correct) btn.classList.add('wrong');
  });
  
  const isCorrect = index === q.correct;
  if (isCorrect) score++;
  else wrongAnswers.push({ questionIndex: currentQ, userAnswer: index });
  
  const expArea = document.getElementById('explanationArea');
  const expClass = isCorrect ? 'correct-exp' : 'wrong-exp';
  const expTitle = isCorrect ? '🎉 回答正确！' : '💡 回答错误，来看解析：';
  const userAnswer = String.fromCharCode(65 + index);
  const correctAnswer = String.fromCharCode(65 + q.correct);
  
  expArea.innerHTML = `
    <div class="explanation ${expClass}">
      <div class="explanation-title">${expTitle}</div>
      <div style="margin-bottom: 12px; padding: 10px 14px; background: rgba(255,255,255,0.7); border-radius: 8px; font-size: 14px; line-height: 1.8;">
        <b>你的选择：</b><span style="font-size: 18px; font-weight: 700; ${isCorrect ? 'color: #2e7d32;' : 'color: #c62828;'}">${userAnswer}</span> ${isCorrect ? '✅' : '❌'}
        ${!isCorrect ? `&nbsp;&nbsp;|&nbsp;&nbsp;<b>正确答案：</b><span style="font-size: 18px; font-weight: 700; color: #2e7d32;">${correctAnswer}</span> ✅` : ''}
      </div>
      <div style="white-space: pre-line;">${q.explanation}</div>
      <div class="clearfix">
        ${currentQ < questions.length - 1 
          ? '<button class="next-btn" onclick="nextQuestion()">下一题 →</button>' 
          : '<button class="next-btn" onclick="showResult()">查看结果 🎯</button>'}
      </div>
    </div>
  `;
}

function nextQuestion() {
  currentQ++;
  renderQuestion();
}

function showResult() {
  document.getElementById('progressFill').style.width = '100%';
  const area = document.getElementById('quizArea');
  const percent = Math.round((score / questions.length) * 100);
  
  let level, desc;
  if (percent >= 90) {
    level = "🏆 面谈大师";
    desc = "太棒了！你已经掌握了绩效面谈的核心精髓——先建立安全、再呈现事实、先处理情绪、再处理事情。你能够用具体数据说话，善于引导员工向内归因，并且懂得后续跟进的重要性。继续保持，你就是团队中最受欢迎的管理者！";
  } else if (percent >= 70) {
    level = "👍 熟练操作者";
    desc = "不错！你已经掌握了绩效面谈的大部分技巧，能够应对常见场景。但在一些细节上还有提升空间。建议重点复习下方列出的薄弱环节，针对性地提升，你的面谈能力还能再上一个台阶！";
  } else if (percent >= 50) {
    level = "📚 进阶学习者";
    desc = "你对绩效面谈有一定的了解，但还存在一些常见误区。别担心，这是大多数管理者的必经阶段。建议你认真阅读下方列出的薄弱环节和推荐章节，带着「先听后说、先平后激」的原则去实践，很快就能看到进步！";
  } else {
    level = "🌱 新手入门";
    desc = "看起来你在绩效面谈方面还有比较大的提升空间。但这完全可以通过学习和练习来改善！建议你从下方列出的薄弱环节开始，逐一攻克，每一次面谈都是一次练习的机会，加油！";
  }
  
  // 错题汇总HTML
  let wrongHTML = '';
  if (wrongAnswers.length > 0) {
    wrongHTML = `
      <div style="margin-top: 28px; text-align: left;">
        <div style="font-size: 18px; font-weight: 700; color: #c62828; margin-bottom: 16px; padding-bottom: 8px; border-bottom: 2px solid #ffcdd2;">📝 你的薄弱环节（共 ${wrongAnswers.length} 题答错）</div>
    `;
    
    wrongAnswers.forEach((item, i) => {
      const q = questions[item.questionIndex];
      const userAns = String.fromCharCode(65 + item.userAnswer);
      const correctAns = String.fromCharCode(65 + q.correct);
      const sceneShort = q.scene.length > 50 ? q.scene.substring(0, 50) + '...' : q.scene;
      
      wrongHTML += `
        <div style="background: #fff8f8; border: 1px solid #ffcdd2; border-radius: 12px; padding: 18px; margin-bottom: 16px;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <span style="background: #c62828; color: #fff; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600;">第 ${item.questionIndex + 1} 题</span>
            <span style="font-size: 13px; color: #666;">
              你的答案：<b style="color: #c62828; font-size: 16px;">${userAns}</b> ❌
              &nbsp;|&nbsp;
              正确答案：<b style="color: #2e7d32; font-size: 16px;">${correctAns}</b> ✅
            </span>
          </div>
          <div style="font-size: 13px; color: #888; margin-bottom: 10px; line-height: 1.6;">🎬 ${sceneShort}</div>
          <div style="background: #fff; border-left: 3px solid #ff9800; padding: 10px 14px; border-radius: 0 6px 6px 0; margin-bottom: 10px;">
            <div style="font-weight: 600; color: #e65100; margin-bottom: 4px;">💡 知识点：${q.knowledge_point}</div>
            <div style="font-size: 13px; color: #555; line-height: 1.7;">${q.improvement_tip}</div>
          </div>
          <div style="background: #f0f7ff; border-left: 3px solid #2196f3; padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 13px; color: #1565c0; line-height: 1.6;">
            📖 <b>推荐阅读：</b>${q.article_section}
          </div>
        </div>
      `;
    });
    
    // 汇总建议
    const knowledgePoints = wrongAnswers.map(item => questions[item.questionIndex].knowledge_point);
    const uniquePoints = [...new Set(knowledgePoints)];
    wrongHTML += `
      <div style="background: linear-gradient(135deg, #fff3e0, #ffe0b2); border-radius: 12px; padding: 18px; margin-top: 20px;">
        <div style="font-weight: 700; color: #e65100; margin-bottom: 10px; font-size: 16px;">🎯 针对你的个性化提升建议</div>
        <div style="font-size: 14px; color: #5d4037; line-height: 1.8;">
          你在以下 <b>${uniquePoints.length}</b> 个知识点上还需要加强：<br>
          ${uniquePoints.map((p, i) => `${i + 1}. ${p}`).join('<br>')}
          <br><br>
          建议你回到文章中，重点阅读上方推荐的章节，结合具体案例深入理解。然后在下次绩效面谈中，有意识地练习这些技巧，熟能生巧！
        </div>
      </div>
    `;
    
    wrongHTML += '</div>';
  } else {
    // 全对的特别表扬
    wrongHTML = `
      <div style="margin-top: 24px; background: linear-gradient(135deg, #e8f5e9, #c8e6c9); border-radius: 12px; padding: 20px; text-align: center;">
        <div style="font-size: 40px; margin-bottom: 10px;">🌟🌟🌟</div>
        <div style="font-weight: 700; color: #2e7d32; font-size: 18px; margin-bottom: 8px;">完美通关！全部答对！</div>
        <div style="font-size: 14px; color: #388e3c; line-height: 1.7;">
          你已经完全掌握了绩效面谈的核心技巧，从开场、应对辩解、情绪处理到后续跟进，都能做出最专业的选择。<br>
          建议你把这些技巧分享给团队的其他管理者，帮助大家一起提升！
        </div>
      </div>
    `;
  }
  
  area.innerHTML = `
    <div class="result-card">
      <div class="score-circle">
        <div class="score-num">${score}</div>
        <div class="score-total">/ ${questions.length} 题</div>
      </div>
      <div class="result-level">${level}</div>
      <div class="result-desc">${desc}</div>
      ${wrongHTML}
      <div style="margin-top: 24px;">
        <button class="restart-btn" onclick="restart()">🔄 再测一次</button>
      </div>
    </div>
  `;
}

function restart() {
  currentQ = 0;
  score = 0;
  wrongAnswers = [];
  renderQuestion();
}

renderQuestion();
</script>
